<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PixelPal Watch">
<title>PixelPal Watch v0.4.0</title>
</head>
<body style="margin:0;background:#090c17;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<div id="loading" style="padding:32px;text-align:center">👾📺 Loading PixelPal Watch v0.4.0…</div>
<script>
(async()=>{
 try{
  const r=await fetch('Index.html?build=0.4.0',{cache:'no-store'});
  if(!r.ok) throw new Error('Could not load programme deck');
  let s=await r.text();
  s=s.replace('</head>','<link rel="stylesheet" href="enhancer.css?build=0.4.0"></head>');
  s=s.replace('</body>','<script src="enhancer.js?build=0.4.0"><\\/script></body>');
  document.open();document.write(s);document.close();
 }catch(e){document.getElementById('loading').innerHTML='<b>PixelPal Watch could not load.</b><br><small>'+e.message+'</small>'}
})();
</script>
</body>
</html>
