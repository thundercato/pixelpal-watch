<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PixelPal Watch">
<title>PixelPal Watch v0.4.1</title>
<style>html,body{margin:0;background:#090c17;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#loading{padding:32px;text-align:center}#ver{position:fixed;right:8px;bottom:7px;z-index:99999;background:#090c17dd;color:#9ba5c2;border:1px solid #2c3453;border-radius:999px;padding:5px 8px;font-size:11px;pointer-events:none}</style>
</head>
<body>
<div id="loading">👾📺 Loading PixelPal Watch v0.4.1…</div>
<div id="ver">v0.4.1</div>
<script>
(async()=>{
 try{
  const r=await fetch('./Index.html?build=0.4.1',{cache:'no-store'});
  if(!r.ok)throw new Error('Could not load programme deck ('+r.status+')');
  let s=await r.text();
  s=s.replace('</head>','<link rel="stylesheet" href="enhancer.css?build=0.4.1"></head>');
  s=s.replace('</body>','<script src="enhancer.js?build=0.4.1"></'+'script></body>');
  document.open();document.write(s);document.close();
 }catch(e){document.getElementById('loading').innerHTML='<b>PixelPal Watch could not load.</b><br><small>'+String(e.message||e)+'</small>'}
})();
</script>
</body>
</html>
