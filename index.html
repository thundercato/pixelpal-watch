<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PixelPal Watch">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PixelPal Watch v0.4.3</title>
<style>body{margin:0;background:#090c17;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}.v{color:#9ba5c2;font-size:12px;margin-top:8px}a{color:#a99cff}</style>
</head>
<body>
<div>👾📺 <b>PixelPal Watch</b><div class="v">Launcher v0.4.3 • checking latest build…</div><p><a id="manual" href="#">Open latest deck</a></p></div>
<script>
(function(){
  // This launcher is deliberately tiny. Every launch generates a unique URL for
  // the real deck, preventing Safari/Home Screen from reusing an old document.
  const stamp=Date.now().toString(36);
  const target='./Index.html?pp_latest=0.4.3&t='+stamp;
  document.getElementById('manual').href=target;
  // Replace rather than redirect so Back does not return to a stale launcher.
  window.location.replace(target);
})();
</script>
</body>
</html>
