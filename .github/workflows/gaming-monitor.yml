name: Gaming monitor
on:
  pull_request:
    paths: ['apps/gaming-monitor/**', '.github/workflows/gaming-monitor.yml']
  push:
    branches: [feature/discord-gaming-monitor]
    paths: ['apps/gaming-monitor/**', '.github/workflows/gaming-monitor.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gaming-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/gaming-monitor/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
